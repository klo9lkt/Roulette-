<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>날씨 점심 룰렛</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root { --bg:#eaf6ff; --ink:#1f2a44; --coral:#ff6b5b; --sun:#ffc83d; --mint:#2bc48a; --line:#cfe3f3; --card:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Jua','Noto Sans KR','Malgun Gothic',sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { text-align:center; margin:8px 0 14px; font-size:2rem; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:18px; padding:16px; }
  button { font-family:inherit; font-size:1rem; border:0; border-radius:12px; padding:9px 14px; cursor:pointer; background:var(--sun); color:var(--ink); }
  button:disabled, input:disabled, select:disabled { opacity:.45; cursor:not-allowed; }
  button.main { background:var(--coral); color:#fff; font-size:1.3rem; padding:13px 28px; }
  button.ghost { background:#eef3f8; }
  input[type=text], select { font-family:inherit; font-size:1rem; padding:9px 10px; border:2px solid var(--line); border-radius:12px; min-width:0; }
  :focus-visible { outline:3px solid var(--ink); outline-offset:2px; }

  #weather .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  #wEmoji { font-size:3.2rem; line-height:1; }
  #wInfo { flex:1; min-width:200px; font-size:1.1rem; }
  #wTemp { font-size:2rem; }
  #rule { margin:10px 0 0; padding:9px 12px; background:#fff7dc; border-radius:12px; }
  #wErr { margin:6px 0 0; font-size:.78rem; color:#888; word-break:break-all; }
  .switch { display:flex; align-items:center; gap:6px; }

  .main-grid { display:grid; grid-template-columns:340px 1fr; gap:16px; margin-top:16px; align-items:start; }
  @media (max-width:820px) { .main-grid { grid-template-columns:1fr; } }
  .add-row { display:flex; gap:6px; flex-wrap:wrap; }
  .add-row input[type=text] { flex:1; min-width:110px; }
  #msg { min-height:1.4em; margin:8px 0; color:var(--coral); }
  #list { list-style:none; margin:0; padding:0; }
  #list li { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px dashed var(--line); }
  #list .name { flex:1; word-break:break-all; }
  #list button { padding:4px 10px; font-size:.85rem; background:#ffe0dc; }
  .count { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }

  .stage { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .wheel-box { position:relative; width:100%; max-width:460px; }
  #wheel { width:100%; height:auto; display:block; }
  #arrow { position:absolute; left:50%; top:-14px; transform:translateX(-50%); font-size:2.6rem; color:var(--coral); text-shadow:0 2px 0 #fff; line-height:1; }
  #count { position:absolute; right:-6px; top:0; font-size:4.5rem; color:var(--coral); min-width:1ch; text-align:center; }
  @media (max-width:820px) { #count { right:4px; font-size:3.2rem; } }

  #history { margin:8px 0 0; padding-left:20px; }

  #modal { position:fixed; inset:0; background:rgba(31,42,68,.55); display:none; align-items:center; justify-content:center; z-index:20; padding:16px; }
  #modal.show { display:flex; }
  .pop { background:#fff; border-radius:24px; padding:28px 24px; text-align:center; max-width:420px; width:100%; }
  .pop h2 { font-size:2rem; margin:0 0 8px; }
  .pop p { margin:0 0 18px; color:#555; min-height:1.2em; }
  .pop .btns { display:flex; gap:8px; justify-content:center; }
  #confetti { position:fixed; inset:0; pointer-events:none; z-index:30; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🍽️ 날씨 점심 룰렛</h1>

  <section id="weather" class="card">
    <div class="row">
      <span id="wEmoji">⏳</span>
      <div id="wInfo">날씨 불러오는 중...</div>
      <div class="add-row">
        <input type="text" id="region" value="안동시" aria-label="지역명" placeholder="지역명 (예: 영주시)" style="width:140px">
        <button id="wBtn" class="ghost">날씨 새로고침</button>
      </div>
      <label class="switch"><input type="checkbox" id="useW" checked> 날씨 반영</label>
    </div>
    <div id="rule"></div>
    <div id="wErr"></div>
  </section>

  <div class="main-grid">
    <section class="card">
      <div class="add-row">
        <input type="text" id="menuIn" placeholder="메뉴 이름" maxlength="20" aria-label="메뉴 이름">
        <select id="kind" aria-label="종류">
          <option value="warm">따뜻한 음식</option>
          <option value="cold">시원한 음식</option>
          <option value="any" selected>상관없음</option>
        </select>
        <button id="addBtn">추가</button>
      </div>
      <div id="msg" role="status"></div>
      <ul id="list"></ul>
      <div class="count"><span id="cnt"></span><button id="clearBtn" class="ghost">전체 삭제</button></div>
    </section>

    <section class="card stage">
      <div class="wheel-box">
        <div id="arrow">▼</div>
        <canvas id="wheel" width="520" height="520"></canvas>
        <div id="count"></div>
      </div>
      <button id="spinBtn" class="main">룰렛 시작</button>
    </section>
  </div>

  <section class="card" style="margin-top:16px">
    <strong>최근 결과</strong>
    <ol id="history"></ol>
  </section>
</div>

<div id="modal"><div class="pop" role="dialog" aria-modal="true">
  <h2 id="popTitle"></h2><p id="popNote"></p>
  <div class="btns"><button id="againBtn" class="main" style="font-size:1.1rem;padding:10px 18px">다시 돌리기</button><button id="closeBtn" class="ghost">닫기</button></div>
</div></div>
<canvas id="confetti"></canvas>

<script>
// ===== 상태 =====
var MAX = 10, MIN = 2, SPIN_MS = 5000;
var menus = [
  { name:'김치찌개', kind:'warm' }, { name:'칼국수', kind:'warm' },
  { name:'돈가스', kind:'any' },   { name:'비빔밥', kind:'any' },
  { name:'냉면', kind:'cold' },     { name:'메밀소바', kind:'cold' }
];
var weather = null;
var spinning = false;
var rotation = 0;
var records = [];
var COLORS = ['#ff8a7a','#ffc83d','#6fd3a5','#6ec1ff','#b79bff','#ff9fd0','#9be15d','#ffb067','#5fd6d6','#e58cff'];
var $ = function (id) { return document.getElementById(id); };

// ===== 날씨 표시/규칙 =====
function emojiOf(w) {
  if (w.pty === '비' || w.pty === '빗방울') return '🌧️';
  if (w.pty === '눈' || w.pty === '눈날림') return '❄️';
  if (w.pty.indexOf('눈') >= 0) return '🌨️';
  return { '맑음':'☀️', '구름많음':'⛅', '흐림':'☁️' }[w.sky] || '🌤️';
}
function currentRule() {
  if (!weather) return { boost:null, text:'날씨 정보를 불러오지 못했어요. 날씨 없이 룰렛을 돌립니다.' };
  if (!$('useW').checked) return { boost:null, text:'날씨 반영이 꺼져 있어요. 모든 메뉴 같은 확률이에요.' };
  var w = weather;
  if (w.pty !== '없음') return { boost:'warm', text:'비 오는 날엔 따끈한 국물! 🔥 메뉴 확률 2배', note:'비 오는 날 추천 메뉴예요' };
  if (w.temp <= 10) return { boost:'warm', text:'쌀쌀한 날엔 따뜻하게! 🔥 메뉴 확률 2배', note:'쌀쌀한 날 추천 메뉴예요' };
  if (w.temp >= 28) return { boost:'cold', text:'더운 날엔 시원하게! 🧊 메뉴 확률 2배', note:'더운 날 추천 메뉴예요' };
  if (w.sky === '맑음' && w.temp >= 15 && w.temp <= 25) return { boost:null, text:'산책하기 좋은 날! 조금 먼 식당도 좋아요 🚶' };
  return { boost:null, text:'오늘은 모든 메뉴 같은 확률이에요.' };
}
function renderWeather() {
  if (weather) {
    $('wEmoji').textContent = emojiOf(weather);
    $('wInfo').innerHTML = '';
    var t = document.createElement('div');
    t.innerHTML = '<span id="wTemp"></span>';
    t.firstChild.textContent = weather.temp + '℃';
    var d = document.createElement('div');
    d.textContent = weather.region + ' · ' + weather.time + ' 예보 · ' + weather.sky + ' · 강수 ' + weather.pty;
    $('wInfo').append(t, d);
  }
  $('rule').textContent = currentRule().text;
}
function loadWeather() {
  if (spinning) return;
  $('wEmoji').textContent = '⏳'; $('wInfo').textContent = '날씨 불러오는 중...'; $('wErr').textContent = '';
  google.script.run
    .withSuccessHandler(function (r) {
      if (r && r.ok) { weather = r; renderWeather(); }
      else fail(r && r.error);
    })
    .withFailureHandler(function (e) { fail(e && e.message); })
    .getWeather($('region').value);
}
function fail(msg) {
  weather = null;
  $('wEmoji').textContent = '❔';
  $('wInfo').textContent = '날씨 정보를 불러오지 못했어요.';
  $('wErr').textContent = msg || '알 수 없는 오류';
  $('rule').textContent = currentRule().text;
}

// ===== 메뉴 관리 =====
function say(t) { $('msg').textContent = t; }
function addMenu() {
  if (spinning) return;
  var name = $('menuIn').value.trim();
  if (!name) { say('메뉴 이름을 입력해 주세요'); return; }
  if (menus.some(function (m) { return m.name === name; })) { say('이미 있는 메뉴예요'); return; }
  if (menus.length >= MAX) return;
  menus.push({ name:name, kind:$('kind').value });
  $('menuIn').value = ''; say(''); refresh(); $('menuIn').focus();
}
function refresh() {
  var ul = $('list'); ul.innerHTML = '';
  menus.forEach(function (m, i) {
    var li = document.createElement('li');
    var n = document.createElement('span'); n.className = 'name';
    n.textContent = m.name + (m.kind === 'warm' ? ' 🔥' : m.kind === 'cold' ? ' 🧊' : '');
    var b = document.createElement('button'); b.textContent = '삭제'; b.disabled = spinning;
    b.onclick = function () { menus.splice(i, 1); refresh(); };
    li.append(n, b); ul.appendChild(li);
  });
  $('cnt').textContent = '현재 ' + menus.length + ' / ' + MAX + '개';
  var full = menus.length >= MAX;
  $('menuIn').disabled = full || spinning; $('addBtn').disabled = full || spinning;
  if (full) say('메뉴는 최대 10개까지 입력할 수 있어요');
  else if ($('msg').textContent.indexOf('최대') >= 0) say('');
  $('clearBtn').disabled = spinning || menus.length === 0;
  $('spinBtn').disabled = spinning;
  $('region').disabled = spinning; $('wBtn').disabled = spinning; $('useW').disabled = spinning;
  drawWheel();
}

// ===== 룰렛 그리기 =====
function drawWheel() {
  var c = $('wheel'), g = c.getContext('2d'), W = c.width, R = W / 2 - 8, n = menus.length;
  g.clearRect(0, 0, W, W);
  g.save(); g.translate(W / 2, W / 2); g.rotate(rotation * Math.PI / 180);
  if (n === 0) {
    g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.fillStyle = '#eef3f8'; g.fill();
    g.rotate(-rotation * Math.PI / 180); g.fillStyle = '#8a97ad'; g.font = '26px Jua, sans-serif'; g.textAlign = 'center';
    g.fillText('메뉴를 추가해 주세요', 0, 8);
  } else {
    var seg = Math.PI * 2 / n;
    menus.forEach(function (m, i) {
      var a0 = -Math.PI / 2 + i * seg;
      g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, R, a0, a0 + seg); g.closePath();
      g.fillStyle = COLORS[i % COLORS.length]; g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 3; g.stroke();
      g.save(); g.rotate(a0 + seg / 2); g.textAlign = 'right'; g.fillStyle = '#1f2a44';
      g.font = (n > 7 ? 22 : 26) + 'px Jua, sans-serif';
      var label = m.name.length > 7 ? m.name.slice(0, 7) + '…' : m.name;
      g.fillText(label, R - 18, 8); g.restore();
    });
  }
  g.restore();
  g.beginPath(); g.arc(W / 2, W / 2, 18, 0, Math.PI * 2); g.fillStyle = '#fff'; g.fill();
  g.strokeStyle = '#cfe3f3'; g.lineWidth = 4; g.stroke();
}

// ===== 당첨 + 회전 =====
function pickWinner() {
  var rule = currentRule();
  var ws = menus.map(function (m) { return (rule.boost && m.kind === rule.boost) ? 2 : 1; });
  var r = Math.random() * ws.reduce(function (a, b) { return a + b; }, 0);
  for (var i = 0; i < ws.length; i++) { r -= ws[i]; if (r < 0) return i; }
  return ws.length - 1;
}
function spin() {
  if (spinning) return;
  if (menus.length < MIN) { say('메뉴를 2개 이상 입력해 주세요'); return; }
  say(''); $('modal').classList.remove('show');
  var win = pickWinner();
  var rule = currentRule();
  var seg = 360 / menus.length;
  var jitter = (Math.random() - 0.5) * seg * 0.7;
  var cur = ((rotation % 360) + 360) % 360;
  var delta = (((-(win + 0.5) * seg - jitter) - cur) % 360 + 360) % 360;
  var start = rotation, total = 360 * 6 + delta;
  spinning = true; refresh();
  var t0 = performance.now();
  (function frame(now) {
    var p = Math.min((now - t0) / SPIN_MS, 1);
    var e = 1 - Math.pow(1 - p, 3);
    rotation = start + total * e; drawWheel();
    $('count').textContent = p < 1 ? Math.ceil((SPIN_MS - (now - t0)) / 1000) : '';
    if (p < 1) requestAnimationFrame(frame); else finish(win, rule);
  })(t0);
}
function finish(win, rule) {
  spinning = false; refresh();
  var m = menus[win];
  $('popTitle').textContent = '오늘 점심은 ' + m.name + '!';
  $('popNote').textContent = (rule.boost && m.kind === rule.boost && rule.note) ? rule.note : '';
  $('modal').classList.add('show'); $('againBtn').focus();
  var d = new Date(), hm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  var wtxt = (weather && $('useW').checked) ? ' (' + emojiOf(weather) + ' ' + weather.temp + '℃)' : '';
  records.unshift(hm + ' - ' + m.name + wtxt); records = records.slice(0, 5);
  $('history').innerHTML = '';
  records.forEach(function (h) { var li = document.createElement('li'); li.textContent = h; $('history').appendChild(li); });
  confetti();
}

// ===== 꽃가루 =====
function confetti() {
  var c = $('confetti'), g = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  var ps = [];
  for (var i = 0; i < 140; i++) ps.push({
    x: c.width / 2, y: c.height / 2, vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 3,
    s: 6 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, col: COLORS[i % COLORS.length]
  });
  var t0 = performance.now();
  (function step(now) {
    g.clearRect(0, 0, c.width, c.height);
    ps.forEach(function (p) {
      p.x += p.vx; p.y += p.vy; p.vy += .35; p.vx *= .99; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.col; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore();
    });
    if (now - t0 < 2800) requestAnimationFrame(step); else g.clearRect(0, 0, c.width, c.height);
  })(t0);
}

// ===== 이벤트 =====
$('addBtn').onclick = addMenu;
$('menuIn').onkeydown = function (e) { if (e.key === 'Enter') addMenu(); };
$('clearBtn').onclick = function () { if (!spinning) { menus = []; say(''); refresh(); } };
$('spinBtn').onclick = spin;
$('againBtn').onclick = spin;
$('closeBtn').onclick = function () { $('modal').classList.remove('show'); };
$('wBtn').onclick = loadWeather;
$('region').onkeydown = function (e) { if (e.key === 'Enter') loadWeather(); };
$('useW').onchange = function () { $('rule').textContent = currentRule().text; };
refresh(); loadWeather();
</script>
</body>
      </html>
